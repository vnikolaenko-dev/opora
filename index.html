function openItem(id){selected=id;render()}
function render(){ $('nav').innerHTML=sections.map(([id,icon,name])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><b>${icon}</b>${name}</button>`).join('');if(selected){renderDetail();return}let html='';
if(page==='day'){let checked=data.habits.filter(h=>h.checks.includes(date())).length;html=`<div class="eyebrow" style="margin-top:28px">ТВОЙ РИТМ, ТВОИ ПРАВИЛА</div><h1>Место для маленьких перемен</h1><p class="muted">Замечай прогресс. Выбирай следующий шаг. Двигайся в своём темпе.</p><div class="hero"><div><div class="eyebrow">ФОКУС НА СЕГОДНЯ</div><strong>Не всё сразу. Что-то важное.</strong><p class="muted">У каждой цели может быть несколько путей.</p><button class="primary" onclick="go('goals')">Открыть мои цели ↗</button></div><div class="hero-mark">◒</div></div><div class="stats"><div class="stat"><span class="muted">Активные цели</span><strong>${data.items.filter(i=>i.type==='goal'&&!i.closed).length}</strong></div><div class="stat"><span class="muted">Привычки сегодня</span><strong>${checked} / ${data.habits.length}</strong></div><div class="stat"><span class="muted">Проблемы в работе</span><strong>${data.items.filter(i=>i.type==='problem'&&!i.closed).length}</strong></div></div><div class="grid"><section><h2>Направления роста</h2>${data.items.filter(i=>i.type==='goal'&&matches(i)).map(card).join('')}</section><section><h2>Сегодня для себя</h2><div class="card">${habitsHTML()}</div><div class="card"><span class="tag">БЫСТРАЯ ЗАПИСЬ</span><h2 style="margin-top:15px">Что сейчас в мыслях?</h2><p class="muted">Сохрани мысль текстом или голосом.</p><button onclick="addNote(null,true)">＋ Добавить заметку</button></div><p class="small muted">Пример данных: суммы и ситуации вымышлены.</p></section></div>`}
if(page==='goals'||page==='difficulties'){let goals=page==='goals';html=`<div class="row spread"><div><h1>${goals?'Мои цели':'Трудности'}</h1><p class="muted">${goals?'Разные пути к тому, что важно. Без обязательной последовательности.':'Отделяй то, что можно изменить, от того, с чем учишься жить.'}</p></div><button class="primary" onclick="createItem('${goals?'goal':'problem'}')">＋ ${goals?'Новая цель':'Новая трудность'}</button></div>${goals?'':`<div class="row tabs">${[['all','Все'],['circumstance','Обстоятельства'],['problem','Проблемы']].map(([f,t])=>`<button class="${filter===f?'selected':''}" onclick="filter='${f}';render()">${t}</button>`).join('')}</div>`}<div class="grid" style="margin-top:25px">${data.items.filter(i=>(goals?i.type==='goal':i.type!=='goal')&&(goals||filter==='all'||i.type===filter)&&matches(i)).map(card).join('')||'<p class="empty">Пока ничего не найдено</p>'}</div>`}
if(page==='habits')html=`<div class="row spread"><div><h1>Полезные привычки</h1><p class="muted">Сегодня достаточно небольшого действия.</p></div><button class="primary" onclick="createHabit()">＋ Привычка</button></div><div class="card" style="margin-top:25px">${habitsHTML()}</div><p class="muted small">В демо — ежедневные отметки. Расписание и календарь предусмотрены требованиями.</p>`;
if(page==='notes')html=`<div class="row spread"><div><h1>Заметки</h1><p class="muted">Мысли, наблюдения и то, что хочется сохранить.</p></div><button class="primary" onclick="addNote(null,true)">＋ Заметка / голос</button></div><div class="noteswide" style="margin-top:25px">${data.notes.filter(matches).slice().reverse().map(n=>`<div class="card">${noteHTML(n)}</div>`).join('')||'<p class="empty">Пока нет заметок</p>'}</div>`;
if(page==='quit')html=`<div class="row spread"><div><h1>Освободить место для себя</h1><p class="muted">Отказ от привычек без обнуления всего пути.</p></div><button class="primary" onclick="createQuit()">＋ Добавить</button></div><div class="grid" style="margin-top:25px">${data.quits.filter(matches).map(q=>{let last=q.events.at(-1)?.date||q.start;let days=Math.max(0,Math.floor((new Date(date())-new Date(last))/86400000));return `<div class="card"><span class="tag">${days} ДН. С ПОСЛЕДНЕГО СОБЫТИЯ</span><h2 style="margin-top:16px">${esc(q.title)}</h2><p class="muted">${esc(q.reason)}</p><div class="hero" style="padding:15px"><p>${esc(q.replacement)}</p></div><button onclick="relapse('${q.id}')">Зафиксировать срыв</button><p class="small muted">Начало: ${esc(q.start)} · событий: ${q.events.length}</p>${q.events.map(noteHTML).join('')}</div>`}).join('')}</div>`;
$('app').innerHTML=page==='day'?`<div class="day-layout"><div class="day-main">${html}</div>${dayRail()}</div>`:html}

function dayRail(){
 const now=new Date(),year=now.getFullYear(),month=now.getMonth(),offset=(new Date(year,month,1).getDay()+6)%7,days=new Date(year,month+1,0).getDate();
 const steps=data.items.filter(i=>!i.closed&&i.type!=='circumstance').flatMap(i=>[...i.steps,...i.branches.filter(b=>!b.closed).flatMap(b=>b.steps)].filter(s=>!s.done).map(s=>({...s,parent:i}))).slice(0,3);
 const complete=data.habits.filter(h=>h.checks.includes(date())).length;
 return `<section class="day-rail" aria-label="Обзор дня"><div class="row spread"><span class="tag">ЛИЧНОЕ ПРОСТРАНСТВО</span><span aria-hidden="true" style="font-size:23px;color:#ab94ee">◐</span></div><div class="calendar-head"><h2 class="rail-title">${esc(now.toLocaleDateString('ru-RU',{month:'long'}))}</h2><span>${year}</span></div><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>'<span class="weekday">'+d+'</span>').join('')}${Array.from({length:offset},()=>'<span class="blank">·</span>').join('')}${Array.from({length:days},(_,i)=>'<span class="date '+(i+1===now.getDate()?'current':'')+'">'+(i+1)+'</span>').join('')}</div><div class="rail-section"><div class="eyebrow">ДОСТУПНЫЕ МИНИ-ШАГИ</div>${steps.map(s=>`<div class="agenda"><button onclick="openItem('${s.parent.id}')">${esc(s.text)}<small>${esc(s.parent.title)} ↗</small></button></div>`).join('')||'<p class="muted small">Все мини-шаги выполнены.</p>'}</div><div class="rail-note"><div class="circle">✓</div><h3>${complete} из ${data.habits.length} сегодня</h3><p>Регулярность начинается с одного небольшого действия.</p><button onclick="go('habits')">К привычкам ↗</button></div></section>`;
}

function habitsHTML(){return data.habits.filter(matches).map(h=>`<label class="check ${h.checks.includes(date())?'done':''}"><input type="checkbox" ${h.checks.includes(date())?'checked':''} onchange="toggleHabit('${h.id}')"><span>${esc(h.title)}</span><small class="muted" style="margin-left:auto">${h.checks.length} отметок</small></label>`).join('')||'<p class="muted">Добавьте первую привычку</p>'}
function toggleHabit(id){let h=data.habits.find(h=>h.id===id),d=date();h.checks=h.checks.includes(d)?h.checks.filter(x=>x!==d):[...h.checks,d];save()}
function noteHTML(n){return `<div class="note"><div class="small muted">${esc(n.date)}</div>${esc(n.text)}</div>`}
function stepsHTML(t,b){return t.steps.map(s=>`<label class="check ${s.done?'done':''}"><input type="checkbox" ${s.done?'checked':''} onchange="toggleStep('${b||''}','${s.id}')"><span>${esc(s.text)}</span></label>`).join('')}
function metricHTML(m,b){let v=[...m.values].sort((a,b)=>a.date.localeCompare(b.date)),last=v.at(-1),prev=v.at(-2),delta=last&&prev?last.value-prev.value:null,ys=v.map(x=>x.value),min=Math.min(0,...ys),max=Math.max(1,...ys),points=v.map((x,i)=>`${v.length===1?250:20+i*460/(v.length-1)},${115-(x.value-min)/(max-min||1)*90}`).join(' ');return `<div style="margin-top:18px;border-top:1px solid var(--line);padding-top:15px"><div class="row spread"><h3>${esc(m.name)}</h3><button class="small" onclick="addValue('${b}','${m.id}')">＋ Значение</button></div>${last?`<strong style="font-size:27px">${fmt(last.value)} <span class="small">${esc(m.unit)}</span></strong><p class="small muted">${delta===null?'Первое измерение':`${delta>=0?'+':''}${fmt(delta)} ${esc(m.unit)}${prev.value!==0?' · '+fmt(Math.round(delta/Math.abs(prev.value)*1000)/10)+'%':''} к прошлому периоду`}</p><svg class="chart" viewBox="0 0 500 140" role="img" aria-label="График ${esc(m.name)}"><line x1="20" x2="480" y1="115" y2="115" stroke="#3a3b45"/><polyline points="${points}" fill="none" stroke="#a0c987" stroke-width="3"/>${points.split(' ').map(p=>{let [x,y]=p.split(',');return `<circle cx="${x}" cy="${y}" r="4" fill="#a0c987"/>`}).join('')}</svg><div class="values">${v.map(x=>`<span>${esc(x.date)}<br><b>${fmt(x.value)} ${esc(m.unit)}</b></span>`).join('')}</div>`:'<p class="muted">Добавьте первое измерение</p>'}</div>`}
function renderDetail(){let i=item();if(!i){selected=null;render();return}let circ=i.type==='circumstance';$('app').innerHTML=`<button style="margin-top:23px" onclick="selected=null;render()">← К списку</button><div class="row spread"><div><h1>${esc(i.title)}</h1><span class="tag ${i.closed?'closed':''}">${typeLabel(i)} · ${i.closed?'ЗАВЕРШЕНО':'В РАБОТЕ'}</span></div>${!circ?`<button onclick="item().closed=!item().closed;save()">${i.closed?'Возобновить':i.type==='goal'?'Цель достигнута':'Проблема решена'}</button>`:''}</div><p class="muted" style="margin:18px 0 25px">${esc(i.description)}</p>${circ?`<div class="hero"><div><h3>Что сейчас в зоне твоего влияния?</h3><p class="muted">Сохрани обстоятельство или выдели доступную для решения часть.</p><div class="row"><button onclick="convert()">Перенести в проблему</button><button onclick="linkedProblem()">Создать связанную проблему</button></div></div></div>`:''}${i.related?`<p>Связано: <button onclick="openItem('${i.related}')">${esc(data.items.find(x=>x.id===i.related)?.title)}</button></p>`:''}${data.items.filter(x=>x.related===i.id).map(x=>`<p>Связанная проблема: <button onclick="openItem('${x.id}')">${esc(x.title)}</button></p>`).join('')}<div class="detail-grid"><section><div class="row spread"><h2>${circ?'Способы адаптации':'Независимые направления'}</h2><button onclick="addBranch()">＋ Направление</button></div>${i.branches.map(b=>`<div class="branch ${b.closed?'off':''}"><div class="row spread"><h3>${esc(b.title)}</h3><button class="small" onclick="toggleBranch('${b.id}')">${b.closed?'Возобновить':'Закрыть'}</button></div><span class="tag ${b.closed?'closed':''}">${b.closed?'ЗАКРЫТО · '+esc(b.closedDate):'АКТИВНО'}</span>${stepsHTML(b,b.id)}<div class="row" style="margin-top:14px"><button class="small" onclick="addStep('${b.id}')">＋ Мини-шаг</button><button class="small" onclick="addNote('${b.id}')">＋ Запись</button><button class="small" onclick="addMetric('${b.id}')">＋ Показатель</button></div>${(b.metrics||[]).map(m=>metricHTML(m,b.id)).join('')}${b.notes.slice().reverse().map(noteHTML).join('')}</div>`).join('')||'<div class="card muted">Можно начать с записи — направления необязательны.</div>'}</section><section><div class="card"><div class="row spread"><h2>Мини-шаги ${circ?'адаптации':'к цели'}</h2><button class="small" onclick="addStep('')">＋ Шаг</button></div>${stepsHTML(i,'')||'<p class="muted small">Без обязательного порядка выполнения.</p>'}</div><div class="card"><div class="row spread"><h2>Общая лента</h2><button class="small" onclick="addNote('')">＋ Запись / голос</button></div><p class="small muted">Записи цели и всех направлений.</p>${[...i.notes.map(n=>({...n,source:'Общая запись'})),...i.branches.flatMap(b=>b.notes.map(n=>({...n,source:b.title})))].sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<div class="small muted" style="margin-top:16px">${esc(n.source)}</div>${noteHTML(n)}`).join('')||'<p class="empty">Здесь будет история продвижения.</p>'}</div><div class="notice">Попробуй: добавь значение дохода, закрой направление или запиши наблюдение. Изменения сохранятся в этом браузере.</div></section></div>`}
function field(label,name,type='text',value='',required=true){return `<label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}>`}
function area(label,name,value=''){return `<label for="f_${name}">${label}</label><textarea id="f_${name}" name="${name}">${esc(value)}</textarea>`}
function show(title,fields,fn){$('dialogTitle').textContent=title;$('fields').innerHTML=fields;onSubmit=fn;$('modal').showModal()}
function closeModal(){if(recognition){recognition.stop();recognition=null}$('modal').close()}
$('modal').addEventListener('cancel',()=>{if(recognition){recognition.stop();recognition=null}});
$('form').onsubmit=e=>{e.preventDefault();let vals=Object.fromEntries(new FormData(e.target));if([...e.target.querySelectorAll('[required]')].some(x=>!x.value.trim()))return toast('Заполните обязательные поля');if(onSubmit(vals)===false)return;closeModal();save()};
function createItem(type){show('Новая '+(type==='goal'?'цель':'трудность'),(type==='goal'?'':'<label for="f_type">Тип</label><select name="type" id="f_type"><option value="problem">Проблема — могу работать над решением</option><option value="circumstance">Обстоятельство — сейчас не могу изменить</option></select>')+field('Название','title')+area('Описание / почему это важно','description'),v=>{let i={id:uid(),type:v.type||type,title:v.title.trim(),description:v.description,steps:[],notes:[],branches:[]};data.items.push(i);selected=i.id})}
function addBranch(){show('Новое независимое направление',field('Название','title'),v=>item().branches.push({id:uid(),title:v.title.trim(),steps:[],notes:[],metrics:[],closed:false}))}
function toggleBranch(id){let b=target(id);b.closed=!b.closed;b.closedDate=b.closed?date():null;save()}
function addStep(b){show('Небольшое действие',field('Что можно сделать?','text'),v=>target(b).steps.push({id:uid(),text:v.text.trim(),done:false}))}
function toggleStep(b,id){let s=target(b).steps.find(s=>s.id===id);s.done=!s.done;save()}
function addNote(b,standalone=false){show('Сохранить мысль',area('Текст заметки','text')+field('Дата','date','date',date())+'<button type="button" style="margin-top:14px" onclick="voice()" id="voiceBtn">◉ Голос в текст</button><p class="small muted" id="voiceStatus">Распознавание зависит от браузера. Аудио может передаваться сервису браузера. Нажмите кнопку, если согласны использовать его.</p>',v=>{if(!v.text.trim()){toast('Введите или надиктуйте текст');return false}(standalone?data.notes:target(b).notes).push({text:v.text.trim(),date:v.date})})}
function voice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voiceStatus').textContent='В этом браузере распознавание недоступно. Используйте текстовый ввод или откройте демо в Chrome/Edge с поддержкой этой функции.';return}if(recognition){recognition.stop();recognition=null;return}let r=new SR;recognition=r;r.lang='ru-RU';r.continuous=false;r.interimResults=false;$('voiceStatus').textContent='Слушаю… Нажмите кнопку повторно, чтобы остановить.';r.onresult=e=>{$('f_text').value+=($('f_text').value?' ':'')+e.results[0][0].transcript};r.onerror=e=>{$('voiceStatus').textContent='Не удалось распознать: '+e.error+'. Можно ввести текст вручную.'};r.onend=()=>{recognition=null;if($('voiceStatus').textContent.startsWith('Слушаю'))$('voiceStatus').textContent='Запись остановлена. Проверьте текст перед сохранением.'};try{r.start()}catch{recognition=null;$('voiceStatus').textContent='Микрофон недоступен. Введите текст вручную.'}}
function addMetric(b){show('Новый показатель',field('Название','name')+field('Единица измерения','unit','text','₽')+'<p class="small muted">Демо показывает значения на выбранные даты. Типы периодов и автоматическая агрегация будут в рабочей версии.</p>',v=>target(b).metrics.push({id:uid(),name:v.name,unit:v.unit,values:[]}))}
function addValue(b,id){let m=target(b).metrics.find(m=>m.id===id);show(m.name,field('Дата / начало периода','date','date',date())+field('Значение ('+esc(m.unit)+')','value','number')+'<p class="small muted">Значение на уже существующую дату заменит предыдущее.</p>',v=>{let n=Number(v.value);if(!Number.isFinite(n))return false;let old=m.values.find(x=>x.date===v.date);if(old)old.value=n;else m.values.push({date:v.date,value:n})});$('f_value').step='any'}
function convert(){show('Перенос в проблему','<p>Все записи, показатели и направления сохранятся. Ситуация появится в списке проблем.</p>',()=>{item().type='problem';item().notes.push({date:date(),text:'Обстоятельство перенесено в проблему: появилась возможность работать над решением.'})})}
function linkedProblem(){let parent=item();show('Связанная проблема',field('Что можно изменить?','title')+area('Описание','description'),v=>{let n={id:uid(),type:'problem',title:v.title,description:v.description,related:parent.id,notes:[],steps:[],branches:[]};data.items.push(n);selected=n.id})}
function createHabit(){show('Полезная привычка',field('Название ежедневной привычки','title'),v=>data.habits.push({id:uid(),title:v.title,checks:[]}))}
function createQuit(){show('Отказ от привычки',field('Название','title')+field('Дата начала','start','date',date())+area('Почему это важно','reason')+area('Что попробовать вместо этого','replacement'),v=>{if(v.start>date()){toast('Дата начала не может быть в будущем');return false}data.quits.push({...v,id:uid(),events:[]})})}
function relapse(id){show('Записать событие',area('Что произошло и что могло бы помочь?','text')+'<p class="small muted">Текущая серия начнётся заново. История и предыдущие усилия сохранятся.</p>',v=>data.quits.find(q=>q.id===id).events.push({date:date(),text:v.text||'Зафиксирован срыв'}))}
function exportData(){let url=URL.createObjectURL(new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='opora-export-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Данные выгружены в JSON')}
$('search').oninput=e=>{query=e.target.value;render()};$('today').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});render();
</script>
<script>
/* UI v2: planning, tracker panels and progressive disclosure. */
data.events ??= [];
data.ui ??= {habitView:'cards',quitView:'cards',menuHidden:false};
let planDate=date(),planMonth=date().slice(0,7),detailTab='steps',activeBranch=null,trackerIndex=0,rotateTrackers=!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
sections.splice(1,0,['planning','▦','Планирование']);
function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function shiftDate(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
function persistUI(){try{localStorage.setItem(key,JSON.stringify(data))}catch{toast('Не удалось сохранить настройки')}}
function toggleMenu(){data.ui.menuHidden=!data.ui.menuHidden;applyMenu();persistUI()}
function applyMenu(){document.querySelector('.layout').classList.toggle('menu-hidden',!!data.ui.menuHidden);$('menuToggle').textContent=data.ui.menuHidden?'☰ Меню':'☰';$('menuToggle').setAttribute('aria-expanded',String(!data.ui.menuHidden))}
const menu=document.createElement('button');menu.id='menuToggle';menu.type='button';menu.title='Скрыть или открыть меню';menu.setAttribute('aria-controls','nav');menu.onclick=toggleMenu;document.querySelector('header').prepend(menu);applyMenu();
const baseRender=render;
render=function(){baseRender();if(selected)return;if(page==='day')renderDay();if(page==='planning')renderPlanning();if(page==='habits')renderHabits();if(page==='quit')renderQuits()};
openItem=function(id){selected=id;activeBranch=null;detailTab='steps';render()};
function setView(type,value){data.ui[type+'View']=value;persistUI();render()}
function viewToggle(type){let view=data.ui[type+'View']||'cards';return `<div class="switch" role="group" aria-label="Вид отображения"><button aria-pressed="${view==='cards'}" class="${view==='cards'?'chosen':''}" onclick="setView('${type}','cards')">◉ Счётчики</button><button aria-pressed="${view==='list'}" class="${view==='list'?'chosen':''}" onclick="setView('${type}','list')">☷ Список</button></div>`}
function streak(h){let n=0,d=h.checks.includes(date())?date():shiftDate(date(),-1);while(h.checks.includes(d)&&n<100000){n++;d=shiftDate(d,-1)}return n}
function weekRate(h){return Array.from({length:7},(_,n)=>shiftDate(date(),-n)).filter(d=>h.checks.includes(d)).length}
function gauge(value,max,caption,color='#a0c987'){let ratio=Math.min(1,Math.max(0,value/(max||1))),circ=251.33;return `<div class="gauge"><svg viewBox="0 0 120 120" role="img" aria-label="${esc(caption)}: ${fmt(value)} из ${fmt(max)}"><circle cx="60" cy="60" r="40" fill="none" stroke="#363642" stroke-width="8" stroke-dasharray="188.5 251.33" transform="rotate(135 60 60)"/><circle cx="60" cy="60" r="40" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${ratio*circ*.75} ${circ}" transform="rotate(135 60 60)"/></svg><div class="gauge-number">${fmt(value)}<small>${esc(caption)}</small></div></div>`}
function renderHabits(){let list=data.habits.filter(matches),cards=data.ui.habitView!=='list';$('app').innerHTML=`<div class="page-title row spread"><div><div class="eyebrow">ЕЖЕДНЕВНЫЙ РИТМ</div><h1>Полезные привычки</h1><p class="muted">Регулярность за последние 7 дней и текущая серия.</p></div><button class="primary" onclick="createHabit()">＋ Привычка</button></div><div class="row spread toolbar"><span class="muted small">${list.length} привычек · ${date()}</span>${viewToggle('habit')}</div>${cards?`<div class="gauges-grid">${list.map(h=>`<article class="card gauge-card"><div class="row spread"><h3>${esc(h.title)}</h3><span class="status-dot ${h.checks.includes(date())?'on':''}" title="${h.checks.includes(date())?'Выполнено сегодня':'Ещё не выполнено'}"></span></div>${gauge(weekRate(h),7,'дней из 7')}<div class="row spread gauge-meta"><span><b>${streak(h)}</b> дн. серия</span><span><b>${h.checks.length}</b> всего отметок</span></div><button class="${h.checks.includes(date())?'':'primary'} full" onclick="toggleHabit('${h.id}')">${h.checks.includes(date())?'✓ Сегодня выполнено · отменить':'＋ Отметить сегодня'}</button></article>`).join('')}</div>`:`<div class="card">${list.map(h=>`<div class="habit-line"><label class="check"><input type="checkbox" ${h.checks.includes(date())?'checked':''} onchange="toggleHabit('${h.id}')"><span>${esc(h.title)}</span></label><span class="muted small">${weekRate(h)}/7 дней · серия ${streak(h)} дн. · всего ${h.checks.length}</span></div>`).join('')}</div>`}${!list.length?'<p class="empty">Нет привычек. Добавьте первую.</p>':''}`}
function quitDays(q){let last=q.events.map(e=>e.date).sort().at(-1)||q.start;return Math.max(0,Math.floor((new Date(date()+'T12:00:00')-new Date(last+'T12:00:00'))/86400000))}
function renderQuits(){let list=data.quits.filter(matches),cards=data.ui.quitView!=='list';$('app').innerHTML=`<div class="page-title row spread"><div><div class="eyebrow">БОЛЬШЕ СВОБОДЫ</div><h1>Отказ от привычек</h1><p class="muted">Счётчик дней и личный ориентир. Вся история сохраняется.</p></div><button class="primary" onclick="createQuit()">＋ Добавить</button></div><div class="row spread toolbar"><span class="small muted">Ориентир можно менять в каждой карточке</span>${viewToggle('quit')}</div><div class="${cards?'gauges-grid':'quit-list'}">${list.map(q=>`<article class="card ${cards?'gauge-card':''}"><div class="row spread"><h3>${esc(q.title)}</h3><button class="small" onclick="quitTarget('${q.id}')">Ориентир: ${q.target||30} дн. ✎</button></div>${cards?gauge(quitDays(q),q.target||30,'дней без срыва','#a58aef'):`<div class="list-counter">${quitDays(q)} <small>дней без срыва / ориентир ${q.target||30}</small></div>`}<p class="muted small">${esc(q.reason)}</p><details><summary>Поддержка и история · ${q.events.length} событий</summary><p>${esc(q.replacement)||'Запишите замещающее действие при создании привычки.'}</p><p class="small muted">Начало: ${esc(q.start)}</p>${q.events.slice().reverse().map(noteHTML).join('')||'<p class="small muted">Событий пока нет.</p>'}</details><button class="full" onclick="relapse('${q.id}')">Зафиксировать срыв</button></article>`).join('')}</div>${!list.length?'<p class="empty">Добавьте привычку, от которой хотите отказаться.</p>':''}`}
function quitTarget(id){let q=data.quits.find(q=>q.id===id);show('Личный ориентир',field('Количество дней','target','number',q.target||30),v=>{if(!Number.isInteger(+v.target)||+v.target<1){toast('Введите целое число от 1');return false}q.target=+v.target});$('f_target').min=1}
function miniCalendar(month=planMonth,mini=false){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),offset=(first.getDay()+6)%7,count=new Date(y,m,0).getDate();return `<div class="row spread calendar-nav"><button aria-label="Предыдущий месяц" onclick="moveMonth(-1)">‹</button><strong>${esc(first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}))}</strong><button aria-label="Следующий месяц" onclick="moveMonth(1)">›</button></div><div class="calendar ${mini?'mini-calendar':'planner-calendar'}">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<span class="weekday">${d}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:count},(_,n)=>{let d=month+'-'+String(n+1).padStart(2,'0'),events=data.events.filter(e=>e.date===d&&!e.done);return `<button class="date ${d===planDate?'picked':''} ${d===date()?'today-date':''}" aria-label="${d}, событий ${events.length}" aria-pressed="${d===planDate}" onclick="selectPlanDate('${d}',${mini})"><span>${n+1}</span>${events.length?`<i class="event-dot"></i>${mini?'':`<small>${events.length} ${events.length===1?'событие':'событий'}</small>`}`:''}</button>`}).join('')}</div>`}
function moveMonth(n){let d=new Date(planMonth+'-01T12:00:00');d.setMonth(d.getMonth()+n);planMonth=iso(d).slice(0,7);render()}
function selectPlanDate(d,fromHome=false){planDate=d;planMonth=d.slice(0,7);if(fromHome)go('planning');else render()}
function eventTime(e){return e.date+'T'+(e.time||'00:00')}
function upcoming(){const localNow=iso(new Date())+'T'+new Date().toTimeString().slice(0,5);return data.events.filter(e=>!e.done&&eventTime(e)>=localNow).sort((a,b)=>eventTime(a).localeCompare(eventTime(b)))}
function eventCard(e,compact=false){let related=data.items.find(i=>i.id===e.related);return `<div class="event-card ${e.done?'event-done':''}"><span class="event-time">${esc(e.time)}${compact?'<small>'+esc(e.date.slice(5).split('-').reverse().join('.'))+'</small>':''}</span><div class="event-info"><button class="event-title" onclick="editEvent('${e.id}')">${esc(e.title)}</button>${related?`<button class="event-link" onclick="openItem('${related.id}')">${esc(related.title)} ↗</button>`:''}${!compact&&e.notes?`<p class="small muted">${esc(e.notes)}</p>`:''}</div>${!compact?`<button aria-label="${e.done?'Вернуть событие':'Завершить событие'} ${esc(e.title)}" onclick="toggleEvent('${e.id}')">${e.done?'↶':'✓'}</button>`:''}</div>`}
function renderPlanning(){let list=data.events.filter(e=>e.date===planDate&&matches(e)).sort((a,b)=>a.time.localeCompare(b.time));$('app').innerHTML=`<div class="page-title row spread"><div><div class="eyebrow">ВРЕМЯ ДЛЯ ВАЖНОГО</div><h1>Планирование</h1><p class="muted">События, встречи и время для своих целей.</p></div><button class="primary" onclick="editEvent()">＋ Событие</button></div><div class="planning-layout"><section class="card"><div class="row spread"><h2>Календарь</h2><button onclick="planDate=date();planMonth=date().slice(0,7);render()">Сегодня</button></div>${miniCalendar()}</section><section><div class="card"><div class="row spread"><h2>${esc(new Date(planDate+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'long'}))}</h2><span class="tag">${list.length} событий</span></div>${list.map(e=>eventCard(e)).join('')||'<div class="empty">День свободен.<br>Запланируйте следующий шаг.</div>'}<button class="full" onclick="editEvent()">＋ Добавить на этот день</button></div><div class="card"><h3>Ближайшие события</h3>${upcoming().slice(0,4).map(e=>eventCard(e,true)).join('')||'<p class="muted small">Будущих событий пока нет.</p>'}</div></section></div>`}
function editEvent(id){let e=data.events.find(e=>e.id===id);show(e?'Изменить событие':'Новое событие',field('Название','title','text',e?.title||'')+field('Дата','date','date',e?.date||planDate)+field('Время','time','time',e?.time||'10:00')+`<label for="f_related">Связать с целью или трудностью</label><select name="related" id="f_related"><option value="">Без привязки</option>${data.items.map(i=>`<option value="${i.id}" ${e?.related===i.id?'selected':''}>${esc(i.title)}</option>`).join('')}</select>`+area('Заметка','notes',e?.notes||'')+(e?`<button type="button" class="danger" style="margin-top:15px" onclick="cancelEvent('${e.id}')">Отменить событие</button>`:''),v=>{if(e)Object.assign(e,v);else data.events.push({...v,id:uid(),done:false});planDate=v.date;planMonth=v.date.slice(0,7)})}
function cancelEvent(id){let e=data.events.find(e=>e.id===id);e.done=true;e.notes=(e.notes?e.notes+'\n':'')+'Событие отменено';closeModal();save();toast('Событие отменено, запись сохранена')}
function toggleEvent(id){let e=data.events.find(e=>e.id===id);e.done=!e.done;save()}
function trackerSources(){let sources=[];for(let i of data.items)for(let b of i.branches)for(let m of b.metrics||[])sources.push({kind:'metric',title:m.name,subtitle:i.title+' / '+b.title,unit:m.unit,values:[...m.values].sort((a,b)=>a.date.localeCompare(b.date)),parent:i.id});for(let h of data.habits)sources.push({kind:'habit',title:h.title,subtitle:'Выполнение за последние 7 дней',unit:'дней из 7',values:Array.from({length:7},(_,n)=>{let d=shiftDate(date(),n-6);return {date:d,value:h.checks.includes(d)?1:0}}),habit:h});for(let q of data.quits)sources.push({kind:'quit',title:q.title,subtitle:'Дни без срыва за последние 7 дней',unit:'дн.',values:Array.from({length:7},(_,n)=>{let d=shiftDate(date(),n-6),last=q.events.map(e=>e.date).filter(x=>x<=d).sort().at(-1)||q.start;return {date:d,value:d<q.start?0:Math.max(0,Math.floor((new Date(d+'T12:00:00')-new Date(last+'T12:00:00'))/86400000))}}),quit:q});return sources}
function trackerHTML(){let sources=trackerSources();if(!sources.length)return '<p class="empty">Добавьте привычку или показатель направления, чтобы увидеть график.</p>';trackerIndex=((trackerIndex%sources.length)+sources.length)%sources.length;let s=sources[trackerIndex],v=s.values,max=Math.max(1,...v.map(x=>x.value)),min=Math.min(0,...v.map(x=>x.value)),points=v.map((x,i)=>[30+(v.length===1?270:i*540/(v.length-1)),140-(x.value-min)/(max-min)*110]),latest=s.kind==='habit'?weekRate(s.habit):v.at(-1)?.value;return `<div class="row spread"><span class="eyebrow">ДИНАМИКА · ${trackerIndex+1} / ${sources.length}</span><div class="row"><label class="auto-label"><input type="checkbox" ${rotateTrackers?'checked':''} onchange="rotateTrackers=this.checked"> Автосмена</label><button aria-label="Предыдущий трекер" onclick="changeTracker(-1)">←</button><button aria-label="Следующий трекер" onclick="changeTracker(1)">→</button></div></div><div class="row spread tracker-heading"><div><h2>${esc(s.title)}</h2><p class="small muted">${esc(s.subtitle)}</p></div><div class="tracker-value">${latest===undefined?'—':fmt(latest)}<small>${esc(s.unit)}</small></div></div>${v.length?`<svg class="tracker-chart" viewBox="0 0 600 180" role="img" aria-label="${esc(s.title)} — график по датам">${[30,85,140].map((y,i)=>`<line x1="30" x2="570" y1="${y}" y2="${y}" stroke="#343440" stroke-dasharray="3 6"/><text x="5" y="${y+4}" fill="#aaa8b6" font-size="10">${fmt(Math.round((max-(max-min)*i/2)*10)/10)}</text>`).join('')}${s.kind==='habit'?points.map(([x,y],n)=>`<rect x="${x-12}" y="${y}" width="24" height="${Math.max(2,140-y)}" rx="4" fill="${v[n].value?'#a0c987':'#464352'}"/>`).join(''):`<polyline points="${points.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.kind==='quit'?'#a88aef':'#a0c987'}" stroke-width="3"/>${points.map(([x,y],n)=>`<circle cx="${x}" cy="${y}" r="4" fill="#b8a3f7"><title>${esc(v[n].date)}: ${fmt(v[n].value)}</title></circle>`).join('')}`}${points.map(([x],n)=>`<text x="${x}" y="168" text-anchor="middle" fill="#a8a5b5" font-size="10">${esc(v[n].date.slice(5).split('-').reverse().join('.'))}</text>`).join('')}</svg>`:'<p class="empty">Пока нет измерений. Добавьте первое в направлении.</p>'}<div class="row spread"><div class="tracker-dots">${sources.map((_,n)=>`<button class="${n===trackerIndex?'on':''}" aria-label="Трекер ${n+1}" aria-pressed="${n===trackerIndex}" onclick="trackerIndex=${n};refreshTracker()"></button>`).join('')}</div><button onclick="${s.parent?`openItem('${s.parent}')`:`go('${s.kind==='habit'?'habits':'quit'}')`}">Открыть трекер ↗</button></div>`}
function refreshTracker(){if($('trackerPanel'))$('trackerPanel').innerHTML=trackerHTML()}
function changeTracker(n){trackerIndex+=n;refreshTracker()}
setInterval(()=>{if(rotateTrackers&&page==='day'&&!selected&&!$('modal').open&&!document.hidden&&!document.querySelector('#trackerPanel:hover')&&!document.querySelector('#trackerPanel:focus-within'))changeTracker(1)},9000);
function renderDay(){let complete=data.habits.filter(h=>h.checks.includes(date())).length;$('app').innerHTML=`<div class="day-layout"><div class="day-main"><div class="page-title"><div class="eyebrow">ЛИЧНЫЙ ОБЗОР</div><h1>Мой день</h1><p class="muted">Прогресс, планы и следующий небольшой шаг.</p></div><section class="card tracker-panel" id="trackerPanel" aria-label="Переключаемые графики">${trackerHTML()}</section><div class="stats compact-stats"><div class="stat"><span class="muted">Активные цели</span><strong>${data.items.filter(i=>i.type==='goal'&&!i.closed).length}</strong></div><div class="stat"><span class="muted">Привычки сегодня</span><strong>${complete} / ${data.habits.length}</strong></div><div class="stat"><span class="muted">Предстоящие события</span><strong>${upcoming().length}</strong></div></div><div class="grid"><section><div class="row spread section-head"><h2>Мои цели</h2><button onclick="go('goals')">Все ↗</button></div>${data.items.filter(i=>i.type==='goal'&&!i.closed&&matches(i)).slice(0,2).map(card).join('')||'<p class="muted">Добавьте первую цель.</p>'}</section><section><div class="row spread section-head"><h2>Сегодня для себя</h2><button onclick="go('habits')">Все ↗</button></div><div class="card">${habitsHTML()}</div><button class="full" onclick="addNote(null,true)">＋ Быстрая заметка / голос</button></section></div></div>${dayRail()}</div>`}
dayRail=function(){return `<section class="day-rail"><div class="row spread"><h2>Планы</h2><button onclick="go('planning')" aria-label="Открыть планирование">↗</button></div>${miniCalendar(planMonth,true)}<div class="rail-section"><div class="row spread section-head"><span class="eyebrow">БЛИЖАЙШИЕ СОБЫТИЯ</span><button onclick="planDate=date();editEvent()" aria-label="Добавить событие">＋</button></div>${upcoming().slice(0,4).map(e=>eventCard(e,true)).join('')||'<p class="muted small">Пока ничего не запланировано.</p>'}<button class="full" onclick="go('planning')">Открыть планирование</button></div></section>`};
function detailSwitch(tab){detailTab=tab;renderDetail()}
function selectBranch(id){activeBranch=id;detailTab='steps';renderDetail()}
renderDetail=function(){let i=item();if(!i){selected=null;render();return}let b=i.branches.find(b=>b.id===activeBranch),t=b||i,circ=i.type==='circumstance',scope=b?b.id:'';let tabs=b?[['steps','Мини-шаги',t.steps.length],['notes','Записи',t.notes.length],['metrics','Показатели',(t.metrics||[]).length]]:[['steps','Направления',i.branches.length],['general','Общие мини-шаги',i.steps.length],['notes','Общая лента',i.notes.length+i.branches.reduce((n,b)=>n+b.notes.length,0)]];
$('app').innerHTML=`<div class="detail-shell"><div class="row spread breadcrumbs"><button onclick="${b?"activeBranch=null;detailTab='steps';renderDetail()":"selected=null;render()"}">← ${b?'К цели / трудности':'К списку'}</button><span class="tag">${typeLabel(i)} · ${i.closed?'ЗАВЕРШЕНО':'В РАБОТЕ'}</span></div><div class="page-title row spread"><div>${b?`<div class="eyebrow">${esc(i.title)}</div>`:''}<h1>${esc(t.title)}</h1>${!b?`<p class="muted">${esc(i.description)}</p>`:`<p class="muted">Независимое направление · ${b.closed?'закрыто':'активно'}</p>`}</div><details class="action-menu"><summary>Действия ⋯</summary><div>${b?`<button onclick="toggleBranch('${b.id}')">${b.closed?'Возобновить':'Закрыть направление'}</button>`:!circ?`<button onclick="item().closed=!item().closed;save()">${i.closed?'Возобновить':i.type==='goal'?'Цель достигнута':'Проблема решена'}</button>`:''}${circ&&!b?'<button onclick="convert()">Перенести в проблему</button><button onclick="linkedProblem()">Создать связанную проблему</button>':''}<button onclick="addNote('${scope}')">Добавить запись / голос</button>${!b?'<button onclick="addBranch()">Новое направление</button>':''}</div></details></div>${!b&&i.related?`<p class="small muted">Связано: <button onclick="openItem('${i.related}')">${esc(data.items.find(x=>x.id===i.related)?.title)}</button></p>`:''}${!b?data.items.filter(x=>x.related===i.id).map(x=>`<p class="small muted">Связанная проблема: <button onclick="openItem('${x.id}')">${esc(x.title)}</button></p>`).join(''):''}<div class="detail-tabs" role="group" aria-label="Содержимое карточки">${tabs.map(([id,label,count])=>`<button aria-pressed="${detailTab===id}" class="${detailTab===id?'current':''}" onclick="detailSwitch('${id}')">${label} <span>${count}</span></button>`).join('')}</div><section class="detail-content">${!b&&detailTab==='steps'?`<div class="row spread section-head"><p class="muted small">${circ?'Способы адаптации к обстоятельству.':'Выберите направление, чтобы увидеть шаги и статистику.'}</p><button class="primary" onclick="addBranch()">＋ Направление</button></div><div class="direction-grid">${i.branches.map(b=>`<button class="direction-card" onclick="selectBranch('${b.id}')"><div class="row spread"><span class="tag ${b.closed?'closed':''}">${b.closed?'ЗАКРЫТО':'АКТИВНО'}</span><span>↗</span></div><h2>${esc(b.title)}</h2><p class="small muted">${b.steps.filter(s=>s.done).length} / ${b.steps.length} шагов · ${b.notes.length} записей · ${(b.metrics||[]).length} показателей</p>${b.metrics?.[0]?.values.length?`<strong>${fmt([...b.metrics[0].values].sort((a,b)=>a.date.localeCompare(b.date)).at(-1).value)} <small>${esc(b.metrics[0].unit)}</small></strong>`:''}</button>`).join('')||'<div class="empty">Направлений пока нет. Можно начать с общей записи или мини-шага.</div>'}</div>`:''}${(b&&detailTab==='steps')||detailTab==='general'?`<div class="card"><div class="row spread section-head"><h2>Мини-шаги</h2><button class="primary" onclick="addStep('${scope}')">＋ Мини-шаг</button></div>${stepsHTML(t,scope)||'<p class="empty">Каким будет следующий небольшой шаг?</p>'}</div>`:''}${detailTab==='notes'?`<div class="row spread section-head"><h2>${b?'Записи направления':'Общая лента'}</h2><button class="primary" onclick="addNote('${scope}')">＋ Запись / голос</button></div><div class="card">${(b?b.notes.map(n=>({...n,source:b.title})):[...i.notes.map(n=>({...n,source:'Общая запись'})),...i.branches.flatMap(b=>b.notes.map(n=>({...n,source:b.title})))]).sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<div class="small muted">${esc(n.source)}</div>${noteHTML(n)}`).join('')||'<p class="empty">Здесь будет история ваших наблюдений.</p>'}</div>`:''}${b&&detailTab==='metrics'?`<div class="row spread section-head"><h2>Динамика направления</h2><button class="primary" onclick="addMetric('${scope}')">＋ Показатель</button></div><div class="card">${(b.metrics||[]).map(m=>metricHTML(m,scope)).join('')||'<p class="empty">Добавьте показатель, чтобы фиксировать изменения.</p>'}</div>`:''}</section></div>`};
render();

</script><script>
/* Personal dashboard constructor. Stored separately from tracker records. */
const spaceKinds={chart:'График / счётчик',stats:'Краткая статистика',habits:'Полезные привычки',quit:'Отказ от привычек',goals:'Цели',difficulties:'Трудности',calendar:'Календарь',events:'Ближайшие события',notes:'Заметки'};
function defaultSpace(){return {version:1,panels:[{id:'sp-chart',kind:'chart',title:'Динамика',width:8,height:360,visible:true,source:'rotate',style:'line',auto:true},{id:'sp-calendar',kind:'calendar',title:'Календарь',width:4,height:360,visible:true},{id:'sp-stats',kind:'stats',title:'Краткая статистика',width:8,height:160,visible:true},{id:'sp-events',kind:'events',title:'Ближайшие события',width:4,height:250,visible:true},{id:'sp-goals',kind:'goals',title:'Мои цели',width:6,height:330,visible:true},{id:'sp-habits',kind:'habits',title:'Привычки сегодня',width:6,height:330,visible:true,view:'list',source:'all'},{id:'sp-notes',kind:'notes',title:'Мои заметки',width:6,height:300,visible:false}]}}
data.ui.space??=defaultSpace();
let spaceEditing=false,spaceDraft=null,spaceSelected=null,spaceDrag=null,spaceChartIndices={};
function spaceConfig(){return spaceEditing?spaceDraft:data.ui.space}
function spacePanel(id){return spaceConfig().panels.find(p=>p.id===id)}
function spaceSources(){let ids=[];for(const i of data.items)for(const b of i.branches)for(const m of b.metrics||[])ids.push('metric:'+i.id+':'+b.id+':'+m.id);for(const h of data.habits)ids.push('habit:'+h.id);for(const q of data.quits)ids.push('quit:'+q.id);return trackerSources().map((s,i)=>({...s,key:ids[i]}))}
function startSpace(){spaceDraft=structuredClone(data.ui.space);spaceEditing=true;spaceSelected=spaceDraft.panels[0]?.id||null;renderDay()}
function cancelSpace(){spaceEditing=false;spaceDraft=null;spaceSelected=null;renderDay()}
function saveSpace(){data.ui.space=structuredClone(spaceDraft);spaceEditing=false;spaceDraft=null;persistUI();renderDay();toast('Моё пространство сохранено')}
function toggleSpace(checked){if(checked)startSpace();else if(spaceEditing)show('Закончить настройку?','<p>Сохранить изменения пространства? Для выхода без изменений нажмите «Отмена» в панели конструктора.</p>',()=>{saveSpace()})}
function resetSpace(){show('Вернуть стандартную раскладку?','<p>Изменится только расположение блоков. Цели, привычки, события и записи сохранятся. До сохранения раскладки действие можно отменить.</p>',()=>{spaceDraft=defaultSpace();spaceSelected=spaceDraft.panels[0].id})}
function updateSpace(id,key,value){let p=spacePanel(id);if(!p)return;p[key]=value;renderDay()}
function resizeSpace(id,height){let p=spacePanel(id);p.height=+height;let el=$('panel-'+id);if(el)el.style.height=height+'px';let label=$('spaceHeight');if(label)label.textContent=height+' px'}
function moveSpace(id,step){let a=spaceDraft.panels,n=a.findIndex(p=>p.id===id),m=n+step;if(m<0||m>=a.length)return;[a[n],a[m]]=[a[m],a[n]];renderDay()}
function dropSpace(id,event){event.preventDefault();if(!spaceEditing||!spaceDrag||spaceDrag===id)return;let a=spaceDraft.panels,from=a.findIndex(p=>p.id===spaceDrag),to=a.findIndex(p=>p.id===id);if(from<0||to<0)return;const [p]=a.splice(from,1);a.splice(to,0,p);spaceDrag=null;renderDay()}
function addSpace(kind){let p={id:'sp-'+uid(),kind,title:spaceKinds[kind],width:['calendar','events'].includes(kind)?4:6,height:kind==='stats'?170:330,visible:true,source:kind==='chart'?'rotate':'all',style:'line',auto:true,view:'list'};spaceDraft.panels.push(p);spaceSelected=p.id;renderDay()}
function duplicateSpace(id){let p=structuredClone(spacePanel(id));p.id='sp-'+uid();p.title+=' · копия';spaceDraft.panels.splice(spaceDraft.panels.findIndex(x=>x.id===id)+1,0,p);spaceSelected=p.id;renderDay()}
function removeSpace(id){spaceDraft.panels=spaceDraft.panels.filter(p=>p.id!==id);spaceSelected=spaceDraft.panels[0]?.id||null;renderDay()}
function selectSpace(id){spaceSelected=id;renderDay()}
function sourceSelect(p,sources,allLabel){return `<select id="spaceSource" aria-label="Источник данных блока" onchange="updateSpace('${p.id}','source',this.value)"><option value="${p.kind==='chart'?'rotate':'all'}">${allLabel}</option>${sources.map(s=>`<option value="${esc(s.key)}" ${p.source===s.key?'selected':''}>${esc(s.title)} · ${esc(s.subtitle)}</option>`).join('')}</select>`}
function spaceEditor(){let p=spacePanel(spaceSelected),sources=spaceSources();return `<aside class="space-editor" aria-label="Конструктор пространства"><div class="row spread"><h2>Конструктор</h2><span class="tag">ЧЕРНОВИК</span></div><p class="small muted">Перетаскивайте блоки за ручку ⋮⋮ или меняйте порядок стрелками. Тяните нижний правый угол блока, чтобы изменить размер.</p><div class="space-actions"><button class="primary" onclick="saveSpace()">Сохранить</button><button onclick="cancelSpace()">Отмена</button></div><details class="palette" open><summary>＋ Добавить блок</summary><div>${Object.entries(spaceKinds).map(([kind,name])=>`<button onclick="addSpace('${kind}')">＋ ${name}</button>`).join('')}</div></details><div class="eyebrow">БЛОКИ И ВИДИМОСТЬ</div><div class="space-layers">${spaceDraft.panels.map(x=>`<div class="space-layer ${spaceSelected===x.id?'selected':''}"><input type="checkbox" aria-label="Показывать ${esc(x.title)}" ${x.visible?'checked':''} onchange="updateSpace('${x.id}','visible',this.checked)"><button onclick="selectSpace('${x.id}')">${esc(x.title)}</button></div>`).join('')||'<p class="muted small">Добавьте первый блок.</p>'}</div>${p?`<section class="space-properties"><div class="eyebrow">НАСТРОЙКИ БЛОКА</div><label for="spaceTitle">Название</label><input id="spaceTitle" value="${esc(p.title)}" maxlength="80" onchange="updateSpace('${p.id}','title',this.value.trim()||spaceKinds['${p.kind}'])"><label for="spaceWidth">Ширина · ${p.width} / 12 колонок</label><input id="spaceWidth" type="range" min="3" max="12" step="1" value="${p.width}" onchange="updateSpace('${p.id}','width',Number(this.value))"><div class="range-labels"><span>¼ экрана</span><span>На всю ширину</span></div><label for="spaceHeightRange">Высота · <span id="spaceHeight">${p.height} px</span></label><input id="spaceHeightRange" type="range" min="160" max="650" step="10" value="${p.height}" oninput="resizeSpace('${p.id}',this.value)">${['chart','habits','quit'].includes(p.kind)?`<label for="spaceSource">Источник данных</label>${sourceSelect(p,sources.filter(s=>p.kind==='chart'||s.kind===(p.kind==='habits'?'habit':'quit')),p.kind==='chart'?'Все трекеры · переключение':'Все привычки')}`:''}${p.kind==='chart'?`<label for="spaceStyle">Визуализация</label><select id="spaceStyle" onchange="updateSpace('${p.id}','style',this.value)">${[['line','Линия'],['bars','Столбцы'],['counter','Большой счётчик']].map(([id,label])=>`<option value="${id}" ${p.style===id?'selected':''}>${label}</option>`).join('')}</select>${p.source==='rotate'?`<label class="inline-check"><input type="checkbox" ${p.auto?'checked':''} onchange="updateSpace('${p.id}','auto',this.checked)"> Автосмена каждые 9 секунд</label>`:''}`:''}${['habits','quit'].includes(p.kind)?`<label for="spaceView">Вид</label><select id="spaceView" onchange="updateSpace('${p.id}','view',this.value)"><option value="list" ${p.view==='list'?'selected':''}>Компактный список</option><option value="gauge" ${p.view==='gauge'?'selected':''}>Счётчики</option></select>`:''}<div class="row space-order"><button aria-label="Поднять блок" onclick="moveSpace('${p.id}',-1)">↑ Выше</button><button aria-label="Опустить блок" onclick="moveSpace('${p.id}',1)">↓ Ниже</button></div><div class="row"><button onclick="duplicateSpace('${p.id}')">Дублировать</button><button class="danger" onclick="removeSpace('${p.id}')">Удалить блок</button></div></section>`:''}<button class="full" onclick="resetSpace()">Стандартная раскладка</button><p class="small muted">Изменения применяются только после сохранения. Скрытие и удаление блока не удаляют его данные.</p></aside>`}
function spaceChart(p){let all=spaceSources(),index=(spaceChartIndices[p.id]||0)%Math.max(1,all.length),s=p.source==='rotate'?all[index]:all.find(s=>s.key===p.source);if(!s)return '<div class="empty">Источник недоступен или ещё не создан.<br>Выберите трекер в конструкторе.</div>';let values=s.values,latest=s.kind==='habit'?weekRate(s.habit):values.at(-1)?.value,unit=s.unit,max=Math.max(1,...values.map(v=>v.value)),min=Math.min(0,...values.map(v=>v.value)),points=values.map((v,n)=>[60+(values.length===1?240:480*n/(values.length-1)),145-(v.value-min)/(max-min)*110]);return `<div class="row spread space-chart-head"><div><h3>${esc(s.title)}</h3><p class="small muted">${esc(s.subtitle)}</p></div>${p.source==='rotate'?`<div class="row"><button aria-label="Предыдущий график ${esc(p.title)}" onclick="cycleSpace('${p.id}',-1)">←</button><button aria-label="Следующий график ${esc(p.title)}" onclick="cycleSpace('${p.id}',1)">→</button></div>`:''}</div><div class="space-reading ${p.style==='counter'?'big-reading':''}">${latest===undefined?'—':fmt(latest)}<small>${esc(unit)}</small></div>${p.style==='counter'?`<p class="small muted">${s.kind==='habit'?'Последние 7 дней':values.at(-1)?'Последнее измерение: '+esc(values.at(-1).date):'Нет измерений'}</p>`:values.length?`<svg class="space-chart" viewBox="0 0 600 185" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(s.title)}: ${p.style==='bars'?'столбцы':'линейный график'}">${[35,90,145].map((y,n)=>`<line x1="60" x2="550" y1="${y}" y2="${y}" stroke="#393644" stroke-dasharray="3 6"/><text x="50" y="${y+4}" text-anchor="end" fill="#aba4b9" font-size="10">${fmt(Math.round((max-(max-min)*n/2)*10)/10)}</text>`).join('')}${p.style==='bars'?points.map(([x,y],n)=>`<rect x="${x-10}" y="${Math.min(y,145-(0-min)/(max-min)*110)}" width="20" height="${Math.max(2,Math.abs(145-(0-min)/(max-min)*110-y))}" rx="3" fill="#a58bf0"><title>${esc(values[n].date)}: ${fmt(values[n].value)}</title></rect>`).join(''):`<polyline points="${points.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#a6cc8c" stroke-width="3"/>${points.map(([x,y],n)=>`<circle cx="${x}" cy="${y}" r="4" fill="#b69af8"><title>${esc(values[n].date)}: ${fmt(values[n].value)}</title></circle>`).join('')}`}${points.filter((_,n)=>values.length<9||n===0||n===values.length-1).map(([x],n,a)=>{let v=values.length<9?values[n]:values[n===0?0:values.length-1];return `<text x="${x}" y="175" text-anchor="middle" fill="#aaa3b8" font-size="10">${esc(v.date.slice(5).split('-').reverse().join('.'))}</text>`}).join('')}</svg>`:'<p class="empty">Нет измерений — добавьте первое в направлении.</p>'}<div class="row spread space-chart-bottom"><span class="small muted">${p.source==='rotate'?`${index+1} / ${all.length} · ${p.auto?'автосмена':'вручную'}`:'Закреплённый трекер'}</span><button onclick="${s.parent?`openItem('${s.parent}')`:`go('${s.kind==='habit'?'habits':'quit'}')`}">Открыть ↗</button></div>`}
function cycleSpace(id,step){let all=spaceSources();spaceChartIndices[id]=((spaceChartIndices[id]||0)+step+all.length)%Math.max(1,all.length);const el=$('space-chart-'+id);if(el)el.innerHTML=spaceChart(spacePanel(id))}
function spaceHabitContent(p,quit=false){let list=(quit?data.quits:data.habits).filter(x=>p.source==='all'||p.source===(quit?'quit:':'habit:')+x.id);if(!list.length)return '<p class="empty">Нет выбранных привычек.</p>';return `<div class="${p.view==='gauge'?'space-mini-gauges':''}">${list.map(h=>quit?`<div class="space-habit">${p.view==='gauge'?gauge(quitDays(h),h.target||30,'дней без срыва','#b08aef'):''}<div class="row spread"><span>${esc(h.title)}</span><strong>${quitDays(h)} дн.</strong></div><button class="small" onclick="relapse('${h.id}')">Записать событие</button></div>`:`<div class="space-habit">${p.view==='gauge'?gauge(weekRate(h),7,'дней из 7'):''}<label class="check"><input type="checkbox" ${h.checks.includes(date())?'checked':''} onchange="toggleHabit('${h.id}')"><span>${esc(h.title)}</span></label><span class="small muted">${weekRate(h)}/7 дней · серия ${streak(h)} дн.</span></div>`).join('')}</div>`}
function spaceContent(p){if(p.kind==='chart')return `<div id="space-chart-${p.id}" class="space-chart-host">${spaceChart(p)}</div>`;if(p.kind==='stats')return `<div class="stats compact-stats"><div class="stat"><span class="muted">Активные цели</span><strong>${data.items.filter(i=>i.type==='goal'&&!i.closed).length}</strong></div><div class="stat"><span class="muted">Привычки сегодня</span><strong>${data.habits.filter(h=>h.checks.includes(date())).length}/${data.habits.length}</strong></div><div class="stat"><span class="muted">События</span><strong>${upcoming().length}</strong></div></div>`;if(p.kind==='habits'||p.kind==='quit')return spaceHabitContent(p,p.kind==='quit');if(p.kind==='calendar')return `${miniCalendar(planMonth,true)}<button class="full" onclick="go('planning')">Планирование ↗</button>`;if(p.kind==='events')return `${upcoming().slice(0,8).map(e=>eventCard(e,true)).join('')||'<p class="empty">Будущих событий пока нет.</p>'}<button class="full" onclick="planDate=date();editEvent()">＋ Событие</button>`;if(p.kind==='goals'||p.kind==='difficulties')return data.items.filter(i=>(p.kind==='goals'?i.type==='goal':i.type!=='goal')&&!i.closed&&matches(i)).map(i=>`<button class="space-item" onclick="openItem('${i.id}')"><span class="tag">${typeLabel(i)}</span><h3>${esc(i.title)}</h3><span class="small muted">${i.branches.length} направлений ↗</span></button>`).join('')||'<p class="empty">Пока нет записей.</p>';if(p.kind==='notes')return `<button class="full" onclick="addNote(null,true)">＋ Заметка / голос</button>${data.notes.filter(matches).slice(-5).reverse().map(noteHTML).join('')}`;return ''}

let panelResize=null;
function panelSize(width,height){return {width:Math.max(3,Math.min(12,Math.round(width))),height:Math.max(160,Math.min(650,Math.round(height/10)*10))}}
function startPanelResize(id,event){
 if(!spaceEditing||event.button!==0||event.isPrimary===false)return;
 event.preventDefault();event.stopPropagation();const p=spacePanel(id),el=$('panel-'+id),grid=el.parentElement,gap=parseFloat(getComputedStyle(grid).columnGap)||18;
 panelResize={id,pointer:event.pointerId,x:event.clientX,y:event.clientY,width:p.width,height:p.height,column:(grid.getBoundingClientRect().width+gap)/12,handle:event.currentTarget};
 spaceSelected=id;document.querySelectorAll('.space-panel.is-selected').forEach(e=>e.classList.remove('is-selected'));el.classList.add('is-selected','is-resizing');
 event.currentTarget.setPointerCapture(event.pointerId);document.body.classList.add('panel-resizing');
}
function movePanelResize(event){
 const r=panelResize;if(!r||event.pointerId!==r.pointer)return;event.preventDefault();
 const size=panelSize(r.width+(event.clientX-r.x)/r.column,r.height+event.clientY-r.y),p=spacePanel(r.id),el=$('panel-'+r.id);Object.assign(p,size);el.style.gridColumn='span '+size.width;el.style.setProperty('--panel-columns',size.width);el.style.height=size.height+'px';
 const badge=el.querySelector('.resize-size');if(badge)badge.textContent=size.width+'/12 · '+size.height+' px';
 r.handle.setAttribute('aria-valuetext',size.width+' колонок, '+size.height+' пикселей');
}
function endPanelResize(event,cancel=false){
 const r=panelResize;if(!r||event&&event.pointerId!==undefined&&event.pointerId!==r.pointer)return;
 panelResize=null;if(cancel)Object.assign(spacePanel(r.id),{width:r.width,height:r.height});document.body.classList.remove('panel-resizing');
 if(r.handle.hasPointerCapture(r.pointer))r.handle.releasePointerCapture(r.pointer);renderDay();const handle=$('resize-'+r.id);if(handle)handle.focus({preventScroll:true});
}
function keyPanelResize(id,event){
 if(!spaceEditing)return;if(event.key==='Escape'&&panelResize){event.preventDefault();endPanelResize(null,true);return}
 if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;event.preventDefault();const p=spacePanel(id),size=panelSize(p.width+(event.key==='ArrowRight'?1:event.key==='ArrowLeft'?-1:0),p.height+(event.key==='ArrowDown'?1:event.key==='ArrowUp'?-1:0)*(event.shiftKey?50:10));Object.assign(p,size);spaceSelected=id;renderDay();$('resize-'+id)?.focus({preventScroll:true});
}

renderDay=function(){const config=spaceConfig(),visible=config.panels.filter(p=>p.visible);$('app').innerHTML=`<div class="row spread page-title space-title"><div><div class="eyebrow">ЛИЧНЫЙ ОБЗОР</div><h1>Моё пространство</h1><p class="muted">${spaceEditing?'Настройте блоки, источники данных и размеры.':'Важное для вас — в удобном порядке.'}</p></div><label class="space-mode"><span>Моё пространство <small>${spaceEditing?'Режим конструктора':'Настроить блоки'}</small></span><input type="checkbox" role="switch" aria-label="Моё пространство — режим конструктора" ${spaceEditing?'checked':''} onchange="const requested=this.checked;if(!requested)this.checked=true;toggleSpace(requested)"><i aria-hidden="true"></i></label></div><div class="space-workbench ${spaceEditing?'is-editing':''}"><section class="space-grid" aria-label="Блоки моего пространства">${visible.map(p=>`<article id="panel-${p.id}" class="space-panel ${spaceEditing&&spaceSelected===p.id?'is-selected':''} ${spaceEditing?'editable':''}" style="--panel-columns:${p.width};grid-column:span ${p.width};height:${p.height}px" ondragover="if(spaceEditing)event.preventDefault()" ondrop="dropSpace('${p.id}',event)"><div class="space-panel-header"><h2>${esc(p.title)}</h2>${spaceEditing?`<div class="row panel-tools"><button class="drag-handle" draggable="true" aria-label="Перетащить ${esc(p.title)}" ondragstart="spaceDrag='${p.id}';event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain','${p.id}')">⋮⋮</button><button aria-label="Настроить ${esc(p.title)}" onclick="selectSpace('${p.id}')">⚙</button><button aria-label="Скрыть ${esc(p.title)}" onclick="updateSpace('${p.id}','visible',false)">×</button></div>`:''}</div><div class="space-panel-body">${spaceContent(p)}</div>${spaceEditing?`<span class="resize-size" aria-live="off">${p.width}/12 · ${p.height} px</span><button type="button" id="resize-${p.id}" class="panel-resize-handle" aria-label="Изменить размер блока ${esc(p.title)}" aria-description="Потяните угол или используйте стрелки: влево и вправо — ширина, вверх и вниз — высота. Escape отменяет перетягивание." title="Потяните, чтобы изменить размер" onpointerdown="startPanelResize('${p.id}',event)" onpointermove="movePanelResize(event)" onpointerup="endPanelResize(event)" onpointercancel="endPanelResize(event,true)" onlostpointercapture="if(panelResize)endPanelResize(event,true)" onkeydown="keyPanelResize('${p.id}',event)"><span aria-hidden="true">◢</span></button>`:''}</article>`).join('')||'<div class="space-empty"><h2>Пространство свободно</h2><p class="muted">Добавьте нужные блоки в конструкторе.</p><button class="primary" onclick="startSpace()">Настроить пространство</button></div>'}</section>${spaceEditing?spaceEditor():''}</div>`};
setInterval(()=>{if(page!=='day'||selected||spaceEditing||document.hidden||$('modal').open||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;for(const p of data.ui.space.panels){let host=$('space-chart-'+p.id);if(p.visible&&p.kind==='chart'&&p.source==='rotate'&&p.auto&&host&&!host.matches(':hover')&&!host.matches(':focus-within'))cycleSpace(p.id,1)}},9000);
render();

</script><script>
/* Studio: positioned 24-column dashboards, history and panel editor. */
spaceKinds.text='Текст / разделитель';
const studioColors=['#b5a1e8','#afc69d','#d9c58d','#91bdca','#ce9eb6','#c99f80'];
let studioInspector=false,studioInspectorTab='settings',studioUndo=[],studioRedo=[],studioGesture=null,studioFullscreen=null;
function studioBounds(p){p.w=Math.max(2,Math.min(24,Math.round(p.w||(+p.width||6)*2)));p.h=Math.max(10,Math.min(100,Math.round(p.h||(+p.height||300)/10)));p.x=Math.max(0,Math.min(24-p.w,Math.round(p.x||0)));p.y=Math.max(0,Math.min(5000,Math.round(p.y||0)));p.width=p.w/2;p.height=p.h*10;return p}
function overlaps(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function placeStudio(p,placed){studioBounds(p);while(placed.some(q=>q.visible!==false&&overlaps(p,q)))p.y=Math.max(...placed.filter(q=>q.visible!==false&&overlaps(p,q)).map(q=>q.y+q.h+1));return p}

function validStudioImport(v){if(v?.format!=='opora-dashboard'||v.version!==2||!v.space||!Array.isArray(v.space.panels)||v.space.panels.length>100)throw Error('Нужен экспорт дашборда Опоры версии 2, не более 100 панелей');const ids=new Set;for(const p of v.space.panels){if(p.sourceStyles&&(typeof p.sourceStyles!=='object'||Array.isArray(p.sourceStyles)||Object.values(p.sourceStyles).some(x=>!['auto','line','area','bars','counter','gauge','table'].includes(x))))throw Error('Некорректные виды трекеров');if(p.pinnedSource!==null&&p.pinnedSource!==undefined&&typeof p.pinnedSource!=='string')throw Error('Некорректная фиксация трекера');if(typeof p.title!=='string'||p.title.length>200||typeof p.visible!=='boolean')throw Error('Некорректное название или видимость');if(p.style&&!['auto','line','area','bars','counter','gauge','table'].includes(p.style))throw Error('Неизвестная визуализация');if(p.colors&&(typeof p.colors!=='object'||Array.isArray(p.colors)||Object.values(p.colors).some(c=>!/^#[a-fA-F0-9]{6}$/.test(c))))throw Error('Некорректные цвета');if(p.thresholdColor&&!/^#[a-fA-F0-9]{6}$/.test(p.thresholdColor))throw Error('Некорректный цвет порога');if(!Object.hasOwn(spaceKinds,p.kind)||typeof p.id!=='string'||!/^[a-zA-Z0-9-]+$/.test(p.id)||ids.has(p.id))throw Error('Некорректный тип или идентификатор панели');ids.add(p.id);if(!['x','y','w','h'].every(k=>Number.isInteger(p[k]))||p.x<0||p.y<0||p.w<2||p.w>24||p.x+p.w>24||p.h<10||p.h>100)throw Error('Размеры или координаты вне сетки');if(p.sources!==undefined&&(!Array.isArray(p.sources)||p.sources.some(x=>typeof x!=='string')))throw Error('Некорректные источники');}return {id:'board-'+uid(),name:String(v.name||'Импортированный дашборд').slice(0,80),space:normalizeStudio(structuredClone(v.space))}}

function studioBegin(id,type,event){if(!spaceEditing||event.button!==0||event.isPrimary===false||studioGesture)return;event.preventDefault();event.stopPropagation();const grid=document.querySelector('.studio-canvas'),p=spacePanel(id),rect=grid.getBoundingClientRect();studioGesture={id,type,pointer:event.pointerId,handle:event.currentTarget,startX:event.clientX,startY:event.clientY,startScroll:window.scrollY||0,col:(rect.width+12)/24,old:structuredClone(spaceDraft),origin:structuredClone(p)};spaceSelected=id;event.currentTarget.focus({preventScroll:true});event.currentTarget.setPointerCapture(event.pointerId);document.body.classList.add(type==='move'?'studio-moving':'panel-resizing')}
function studioMove(event){const r=studioGesture;if(!r||r.pointer!==event.pointerId)return;event.preventDefault();spaceDraft=structuredClone(r.old);const p=spacePanel(r.id),dx=Math.round((event.clientX-r.startX)/r.col),dy=Math.round((event.clientY-r.startY+(window.scrollY||0)-r.startScroll)/10),o=r.origin;if(r.type==='move'){p.x=Math.max(0,Math.min(24-p.w,o.x+dx));p.y=Math.max(0,o.y+dy)}else{if(r.type.includes('e'))p.w=Math.max(2,Math.min(24-o.x,o.w+dx));if(r.type.includes('s'))p.h=Math.max(10,Math.min(100,o.h+dy));if(r.type==='w'){const x=Math.max(0,Math.min(o.x+o.w-2,o.x+dx));p.x=x;p.w=o.x+o.w-x}}studioBounds(p);studioResolve(p.id);studioPaint()}

function studioKey(id,type,event){if(event.key==='Escape'&&studioGesture){event.preventDefault();studioEnd(null,true);return}if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;event.preventDefault();studioCheckpoint();const p=spacePanel(id),dx=event.key==='ArrowRight'?1:event.key==='ArrowLeft'?-1:0,dy=event.key==='ArrowDown'?1:event.key==='ArrowUp'?-1:0;if(type==='move'){p.x+=dx;p.y+=dy}else{p.w+=dx;p.h+=dy*(event.shiftKey?5:1)}studioBounds(p);studioResolve(id);renderDay();$('studio-handle-'+id+'-'+type)?.focus({preventScroll:true})}

function studioInspectorHTML(){const p=spacePanel(spaceSelected),sources=spaceSources();return `<aside class="space-editor studio-inspector" aria-label="Редактор панели"><div class="row spread"><h2>${studioInspectorTab==='panels'?'Панели дашборда':'Редактор панели'}</h2><button onclick="studioInspector=false;renderDay()" aria-label="Закрыть редактор панели">×</button></div><div class="row tabs"><button onclick="studioInspectorTab='panels';renderDay()">Все панели</button><button onclick="studioInspectorTab='settings';renderDay()">Настройки</button></div>${studioInspectorTab==='panels'?`<div class="studio-catalog">${Object.entries(spaceKinds).map(([k,n])=>`<button onclick="studioAdd('${k}')">＋ ${n}</button>`).join('')}</div><h3 style="margin-top:24px">Видимость</h3>${spaceDraft.panels.map(p=>`<div class="space-layer"><input type="checkbox" aria-label="Показывать ${esc(p.title)}" ${p.visible?'checked':''} onchange="updateSpace('${p.id}','visible',this.checked)"><button onclick="selectSpace('${p.id}')">${esc(p.title)}</button></div>`).join('')}`:p?`<p class="small muted">${spaceKinds[p.kind]} · ${p.w}/24 колонок</p><details><summary>Панель: название, положение, размер</summary>${studioField(p,'title','Название')}${studioField(p,'description','Описание')}${studioField(p,'x','Позиция X (колонки)','number','min="0" max="22"')}${studioField(p,'y','Позиция Y (шаг 10 px)','number','min="0"')}${studioField(p,'w','Ширина (2–24)','number','min="2" max="24"')}${studioField(p,'h','Высота (10–100 × 10 px)','number','min="10" max="100"')}</details>${p.kind==='chart'?`<details open><summary>Данные и источники</summary>${studioOptions(p,'period','Период панели',studioPeriods)}<label for="studio-mode">Режим источников</label><select id="studio-mode" onchange="studioMode('${p.id}',this.value)"><option value="multi" ${p.mode==='multi'?'selected':''}>Несколько рядов на одной панели</option><option value="rotate" ${p.mode==='rotate'?'selected':''}>Карусель выбранных трекеров</option></sele
