const legacyStudioSources=spaceSources;
spaceSources=function(){const sources=legacyStudioSources();for(const s of sources){if(s.kind==='habit'){const h=s.habit,first=[...h.checks.filter(d=>d<=date()),shiftDate(date(),-6)].sort()[0];s.unit='дней выполнения';s.subtitle='Ежедневные отметки привычки';s.values=[];for(let d=first;d<=date();d=shiftDate(d,1))s.values.push({date:d,value:h.checks.includes(d)?1:0})}if(s.kind==='quit'){const q=s.quit,events=q.events.map(e=>e.date).sort();s.subtitle='Дни воздержания по датам';s.values=[];let index=0,last=q.start;for(let d=q.start;d<=date();d=shiftDate(d,1)){while(index<events.length&&events[index]<=d){last=events[index];index++}s.values.push({date:d,value:Math.max(0,Math.floor((new Date(d+'T12:00:00')-new Date(last+'T12:00:00'))/86400000))})}}}return sources};

function studioRows(p){const sources=spaceSources(),chosen=(p.sources||[]).map(key=>sources.find(s=>s.key===key)).filter(Boolean);let rows=p.mode==='rotate'&&chosen.length?[chosen[(spaceChartIndices[p.id]||0)%chosen.length]]:chosen;const range=p.period==='inherit'?spaceConfig().range:p.period,from=range==='all'||!range?null:shiftDate(date(),1-Number(range));return rows.map(s=>({...s,color:p.colors[s.key]||studioColors[sources.findIndex(x=>x.key===s.key)%studioColors.length],values:s.values.filter(v=>(!from||v.date>=from)&&v.date<=date())}))}
function studioReduce(p,s){const values=s.values.map(v=>v.value);if(!values.length)return null;const reduce=p.reduce==='auto'?(s.kind==='habit'?'sum':'last'):p.reduce;return reduce==='sum'?values.reduce((a,b)=>a+b,0):reduce==='avg'?values.reduce((a,b)=>a+b,0)/values.length:reduce==='min'?Math.min(...values):reduce==='max'?Math.max(...values):reduce==='count'?values.length:values.at(-1)}
function studioNumber(p,value){return value===null?'—':Number(value).toLocaleString('ru-RU',{maximumFractionDigits:Math.max(0,Math.min(4,p.decimals||0))})}
function studioThreshold(p){return String(p.threshold??'').trim()!==''&&Number.isFinite(Number(p.threshold))?Number(p.threshold):null}
spaceChart=function(p){const rows=studioRows(p),allSelected=(p.sources||[]).length,n=spaceChartIndices[p.id]||0,dec=p.decimals||0;const head=`<div class="row spread"><span class="small muted">${p.period==='inherit'?'Период дашборда':studioPeriods.find(x=>x[0]===p.period)?.[1]||'Всё время'}</span>${p.mode==='rotate'?`<div class="row"><button aria-label="Предыдущий график ${esc(p.title)}" onclick="cycleSpace('${p.id}',-1)">←</button><span class="small muted">${allSelected?n%allSelected+1:0}/${allSelected}</span><button aria-label="Следующий график ${esc(p.title)}" onclick="cycleSpace('${p.id}',1)">→</button></div>`:''}</div>`;if(!rows.length)return head+'<div class="empty">Выберите источники в редакторе панели.</div>';const threshold=studioThreshold(p),colorThreshold=p.thresholdColor||'#e6a065';
if(p.style==='counter'||p.style==='gauge'){return head+`<div class="studio-counters">${rows.map(s=>{const value=studioReduce(p,s),color=threshold!==null&&value!==null&&value>=threshold?colorThreshold:s.color;return `<div class="studio-counter"><span class="small muted">${esc(s.title)}</span>${p.style==='gauge'&&value!==null?gauge(value,p.gaugeMax||100,p.unit||s.unit,color):`<strong style="color:${esc(color)}">${studioNumber(p,value)}</strong>`}<span class="small muted">${esc(p.unit||s.unit)}</span><small class="muted">${s.values.length} измерений</small></div>`}).join('')}</div>`}
if(p.style==='table')return head+`<div class="studio-table-wrap"><table class="studio-table"><thead><tr><th>Дата</th><th>Источник</th><th>Значение</th><th>Единица</th></tr></thead><tbody>${rows.flatMap(s=>s.values.map(v=>({...v,source:s.title,unit:p.unit||s.unit}))).sort((a,b)=>b.date.localeCompare(a.date)).map(v=>`<tr><td>${esc(v.date)}</td><td>${esc(v.source)}</td><td>${studioNumber(p,v.value)}</td><td>${esc(v.unit)}</td></tr>`).join('')||'<tr><td colspan="4">Нет измерений за период</td></tr>'}</tbody></table></div>`;
const units=[...new Set(rows.map(s=>s.unit))];if(units.length>1)return head+'<div class="notice">У выбранных рядов разные единицы. Для общей шкалы выберите совместимые источники либо используйте таблицу или счётчики.</div>';
const all=rows.flatMap(s=>s.values);if(!all.length)return head+'<div class="empty">Нет измерений за выбранный период.<br>Измените период или добавьте запись.</div>';
const dates=[...new Set(all.map(v=>v.date))].sort(),times=dates.map(d=>new Date(d+'T12:00:00').getTime()),first=times[0],last=times.at(-1),nums=all.map(v=>v.value);let min=String(p.axisMin??'').trim()!==''?Number(p.axisMin):Math.min(0,...nums),max=String(p.axisMax??'').trim()!==''?Number(p.axisMax):Math.max(1,...nums);if(!Number.isFinite(min)||!Number.isFinite(max)||max<=min)return head+'<div class="notice">Максимум шкалы должен быть больше минимума.</div>';const px=d=>70+(first===last?245:(new Date(d+'T12:00:00').getTime()-first)/(last-first)*490),py=v=>155-(v-min)/(max-min)*125;const zero=Math.max(30,Math.min(155,py(0))),clip='clip-'+p.id;
return head+`<svg class="studio-chart" viewBox="0 0 600 190" preserveAspectRatio="none" role="img" aria-label="График ${esc(p.title)}"><defs><clipPath id="${clip}"><rect x="68" y="25" width="496" height="133"/></clipPath></defs>${[0,1,2,3].map(n=>{let y=30+n*125/3;return `<line x1="70" x2="560" y1="${y}" y2="${y}" stroke="#3a3545" stroke-dasharray="3 5"/><text x="60" y="${y+4}" text-anchor="end" font-size="10" fill="#a59daf">${studioNumber({...p,decimals:Math.max(p.decimals||0,2)},max-(max-min)*n/3)}</text>`}).join('')}<g clip-path="url(#${clip})">${rows.map((s,idx)=>{let coords=s.values.map(v=>[px(v.date),py(v.value)]),points=coords.map(v=>v.join(',')).join(' ');return p.style==='bars'?coords.map(([x,y],n)=>`<rect x="${x-9+idx*8}" y="${Math.min(y,zero)}" width="${Math.max(3,18/rows.length)}" height="${Math.max(1,Math.abs(zero-y))}" fill="${esc(s.color)}"><title>${esc(s.title)} · ${esc(s.values[n].date)}: ${studioNumber(p,s.values[n].value)}</title></rect>`).join(''):`${p.style==='area'&&coords.length?`<polygon points="${coords[0][0]},${zero} ${points} ${coords.at(-1)[0]},${zero}" fill="${esc(s.color)}" fill-opacity=".13"/>`:''}<polyline points="${points}" fill="none" stroke="${esc(s.color)}" stroke-width="${Math.max(1,Math.min(6,p.lineWidth||2))}" vector-effect="non-scaling-stroke"/>${coords.map(([x,y],n)=>`<circle cx="${x}" cy="${y}" r="3" fill="${esc(s.color)}"><title>${esc(s.title)} · ${esc(s.values[n].date)}: ${studioNumber(p,s.values[n].value)}</title></circle>`).join('')}`}).join('')}${threshold!==null?`<line x1="70" x2="560" y1="${py(threshold)}" y2="${py(threshold)}" stroke="${esc(colorThreshold)}" stroke-dasharray="6 4"/>`:''}</g>${dates.filter((d,n)=>dates.length<6||n===0||n===dates.length-1||n===Math.floor(dates.length/2)).map(d=>`<text x="${px(d)}" y="180" text-anchor="middle" font-size="10" fill="#a59daf">${esc(d.slice(5).split('-').reverse().join('.'))}</text>`).join('')}</svg>${p.legend?`<div class="studio-legend">${rows.map(s=>`<span><i style="background:${esc(s.color)}"></i>${esc(s.title)} <b>${studioNumber(p,studioReduce(p,s))}</b> ${esc(p.unit||s.unit)}</span>`).join('')}</div>`:''}`};
cycleSpace=function(id,step){const p=spacePanel(id),length=(p.sources||[]).length;spaceChartIndices[id]=((spaceChartIndices[id]||0)+step+length)%Math.max(1,length);const el=$('space-chart-'+id);if(el)el.innerHTML=spaceChart(p)};
renderDay=function(){const config=spaceConfig();$('app').innerHTML=`<div class="studio-top"><div><div class="eyebrow">МОЁ ПРОСТРАНСТВО / ДАШБОРДЫ</div><div class="row"><select class="studio-board-select" aria-label="Дашборд" ${spaceEditing?'disabled':''} onchange="switchBoard(this.value)">${data.ui.boards.map(b=>`<option value="${b.id}" ${b.id===data.ui.activeBoard?'selected':''}>${esc(b.name)}</option>`).join('')}</select>${!spaceEditing?`<details class="studio-board-menu"><summary>⋯</summary><div><button onclick="boardDialog('new')">＋ Новый дашборд</button><button onclick="boardDialog('clone')">Копировать дашборд</button><button onclick="boardDialog('rename')">Переименовать</button><button onclick="studioExport()">Экспорт раскладки</button><button onclick="studioImport()">Импорт раскладки</button></div></details>`:''}</div></div><div class="row"><select aria-label="Период дашборда" onchange="studioRange(this.value)">${studioPeriods.filter(x=>x[0]!=='inherit').map(([v,n])=>`<option value="${v}" ${config.range===v?'selected':''}>${n}</option>`).join('')}</select>${spaceEditing?'<button onclick="cancelSpace()">Отмена</button><button class="primary" onclick="saveSpace()">Сохранить дашборд</button>':'<button class="primary" onclick="startSpace()">✎ Редактировать</button>'}</div></div>${spaceEditing?`<div class="studio-toolbar"><div class="row"><button class="primary" onclick="studioInspector=true;studioInspectorTab='panels';renderDay()">＋ Добавить панель</button><button onclick="studioInspector=true;studioInspectorTab='panels';renderDay()">Панели · ${config.panels.length}</button><button onclick="studioUndoAction()" ${studioUndo.length?'':'disabled'} aria-label="Отменить действие">↶</button><button onclick="studioRedoAction()" ${studioRedo.length?'':'disabled'} aria-label="Повторить действие">↷</button><button onclick="studioCompact()">Уплотнить</button></div><span class="small muted">24 колонки · двигайте за ⋮⋮ · тяните за края · изменения в черновике</span></div>`:''}<div class="studio-workspace ${spaceEditing&&studioInspector?'with-inspector':''}"><section class="space-grid studio-canvas ${spaceEditing?'studio-editing':''}" aria-label="Сетка дашборда">${config.panels.filter(p=>p.visible).map(studioPanel).join('')||`<div class="space-empty"><h2>Ваш новый дашборд</h2><p class="muted">Добавьте графики, счётчики и другие панели.</p><button class="primary" onclick="${spaceEditing?"studioInspector=true;studioInspectorTab='panels';renderDay()":"startSpace()"}">＋ Добавить первую панель</button></div>`}</section>${spaceEditing&&studioInspector?studioInspectorHTML():''}</div>`};
render();

</script><script>
/* Quick panel presentation and persistent tracker pinning. */
const panelViewTypes=[['auto','Авто'],['counter','Счётчик'],['gauge','Круговая шкала'],['line','Линия'],['area','Область'],['bars','Столбцы'],['table','Таблица']];
function migratePanelViews(space){for(const p of space.panels||[]){if(p.kind!=='chart')continue;if(!p.presentationVersion){if(!p.style||p.style==='line')p.style='auto';p.presentationVersion=1}p.sourceStyles??={};p.pinnedSource??=null}return space}
const normalizeBeforeViews=normalizeStudio;
normalizeStudio=function(s){return migratePanelViews(normalizeBeforeViews(s))};
for(const b of data.ui.boards)migratePanelViews(b.space);
migratePanelViews(data.ui.space);
const rowsBeforePin=studioRows;
studioRows=function(p){return rowsBeforePin(p.pinnedSource?{...p,sources:[p.pinnedSource],mode:'multi'}:p)};
function currentPanelSource(p){return studioRows(p)[0]?.key||null}
function requestedPanelView(p){const key=currentPanelSource(p);return (p.mode==='rotate'||p.pinnedSource)&&key?(p.sourceStyles?.[key]||p.style||'auto'):(p.style||'auto')}
function effectivePanelView(p,rows=studioRows(p)){const view=requestedPanelView(p);return view==='auto'?(rows.length&&rows.every(s=>s.kind==='habit'||s.kind==='quit')?'counter':'line'):view}
function changePanelPresentation(id,fn){const p=spacePanel(id);if(!p)return;const before=structuredClone(p);if(spaceEditing)studioCheckpoint();fn(p);if(!spaceEditing){try{localStorage.setItem(key,JSON.stringify(data))}catch{Object.keys(p).forEach(k=>delete p[k]);Object.assign(p,before);toast('Не удалось сохранить настройку панели');return}}if(spaceEditing)renderDay();else{const host=$('space-chart-'+id);if(host)host.innerHTML=spaceChart(p)}}
function setPanelView(id,view){if(!panelViewTypes.some(x=>x[0]===view))return;changePanelPresentation(id,p=>{const key=currentPanelSource(p);p.sourceStyles??={};if((p.mode==='rotate'||p.pinnedSource)&&key)p.sourceStyles[key]=view;else p.style=view;p.presentationVersion=1})}
function pinPanelSource(id){const p=spacePanel(id),key=currentPanelSource(p);if(!key&&!p.pinnedSource)return;changePanelPresentation(id,p=>{p.pinnedSource=p.pinnedSource?null:key});toast(spacePanel(id).pinnedSource?'Трекер зафиксирован':'Автосмена трекеров восстановлена')}
const cycleBeforePin=cycleSpace;
cycleSpace=function(id,step){const p=spacePanel(id);if(!p||p.pinnedSource)return;cycleBeforePin(id,step)};
function panelViewControls(p){const requested=requestedPanelView(p),source=currentPanelSource(p),selectedCount=(p.sources||[]).length;return `<div class="panel-view-controls"><label><span>Вид</span><select aria-label="Тип отображения панели ${esc(p.title)}" onchange="setPanelView('${p.id}',this.value)">${panelViewTypes.map(([key,label])=>`<option value="${key}" ${requested===key?'selected':''}>${label}</option>`).join('')}</select></label>${p.mode==='rotate'||p.pinnedSource?`<button class="pin-panel ${p.pinnedSource?'is-pinned':''}" aria-pressed="${!!p.pinnedSource}" ${!source&&!p.pinnedSource?'disabled':''} onclick="pinPanelSource('${p.id}')" title="${p.pinnedSource?'Вернуть переключение выбранных трекеров':'Оставить текущий трекер и остановить автосмену'}">${p.pinnedSource?'⌖ Зафиксирован · снять':'⌖ Зафиксировать'}</button>`:''}${p.pinnedSource?'<span class="small muted pin-hint">Автосмена остановлена</span>':''}</div>`}
function habitCounterPanel(p,rows){return `<div class="habit-panel-counters">${rows.map(s=>{const h=s.habit,value=studioReduce(p,s),checked=h.checks.includes(date()),color=studioThreshold(p)!==null&&value!==null&&value>=studioThreshold(p)?p.thresholdColor:s.color;return `<section class="habit-panel-counter"><div class="row spread"><h3>${esc(s.title)}</h3><span class="tag ${checked?'':'closed'}">${checked?'СЕГОДНЯ ✓':'СЕГОДНЯ —'}</span></div><div class="habit-panel-value" style="color:${esc(color)}">${studioNumber(p,value)}<small>${esc(p.unit||'Дни выполнения за период')}</small></div><div class="row spread small muted"><span>Серия <b>${streak(h)}</b> дн.</span><span>Всего отметок <b>${h.checks.length}</b></span></div><button class="full ${checked?'':'primary'}" onclick="toggleHabit('${h.id}')">${checked?'✓ Выполнено сегодня · отменить':'＋ Отметить сегодня'}</button></section>`}).join('')}</div>`}
const chartBeforeViews=spaceChart;
spaceChart=function(p){const rows=studioRows(p),style=effectivePanelView(p,rows),clone={...p,style};if(p.pinnedSource){clone.mode='multi';clone.sources=[p.pinnedSource];clone.pinnedSource=p.pinnedSource}const controls=panelViewControls(p);const habitNavigation=`<div class="row spread"><span class="small muted">${p.period==='inherit'?'Период дашборда':studioPeriods.find(x=>x[0]===p.period)?.[1]||'Всё время'}</span>${p.mode==='rotate'&&!p.pinnedSource?`<div class="row"><button aria-label="Предыдущий график ${esc(p.title)}" onclick="cycleSpace('${p.id}',-1)">←</button><span class="small muted">${(spaceChartIndices[p.id]||0)%(p.sources.length||1)+1}/${p.sources.length}</span><button aria-label="Следующий график ${esc(p.title)}" onclick="cycleSpace('${p.id}',1)">→</button></div>`:''}</div>`;return controls+(style==='counter'&&rows.length&&rows.every(s=>s.kind==='habit')?habitNavigation+habitCounterPanel(p,rows):chartBeforeViews(clone))};
const optionsBeforeViews=studioOptions;
studioOptions=function(p,key,label,options){if(key!=='style')return optionsBeforeViews(p,key,label,options);const requested=requestedPanelView(p);return `<label for="studio-style">${p.mode==='rotate'||p.pinnedSource?'Вид текущего трекера':'Тип отображения'}</label><select id="studio-style" onchange="setPanelView('${p.id}',this.value)">${panelViewTypes.map(([v,n])=>`<option value="${v}" ${v===requested?'selected':''}>${n}</option>`).join('')}</select><p class="small muted">Авто: привычки — счётчики, числовые показатели — линия. В карусели выбор запоминается отдельно для каждого трекера.</p>`};
const inspectorBeforeViews=studioInspectorHTML;
studioInspectorHTML=function(){let html=inspectorBeforeViews(),p=spacePanel(spaceSelected);if(p?.kind==='chart')html=html.replace('<summary>Данные и источники</summary>','<summary>Данные и источники</summary>'+((p.mode==='rotate'||p.pinnedSource)?`<button class="full ${p.pinnedSource?'pin-panel is-pinned':''}" onclick="pinPanelSource('${p.id}')">${p.pinnedSource?'Снять фиксацию трекера':'Зафиксировать текущий трекер'}</button>`:''));return html};

studioMode=function(id,value){studioCheckpoint();const p=spacePanel(id);p.mode=value;p.source=value==='rotate'?'rotate':'multi';p.pinnedSource=null;renderDay()};
studioSelectSource=function(id,key,checked){studioCheckpoint();const p=spacePanel(id);p.sources=checked?[...new Set([...(p.sources||[]),key])]:(p.sources||[]).filter(x=>x!==key);if(!checked&&p.pinnedSource===key)p.pinnedSource=null;p.source=p.mode==='rotate'?'rotate':'multi';renderDay()};

render();

</script></body></html>
